[project]
name = "omnimind"
version = "0.1.0"
description = "面向课程与考试场景的个人智能学习 Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "deepagents>=0.6,<0.7",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-mongodb>=0.3,<1",
  "mcp>=1.13,<2",
  "minio>=7.2,<8",
  "opensandbox>=0.1,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.14,<5",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "freezegun>=1.5,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers>=4.13,<5",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent", "omnimind"]
